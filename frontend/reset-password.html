<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#283e32">
    <title>Choose a new password — UniLost</title>
    <link rel="stylesheet" href="/css/site.css">
    <script type="module" src="/js/app.js"></script>
</head>

<body data-page="reset"><a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>
    <main id="main" class="auth-shell">
        <section class="auth-card">
            <p class="eyebrow">Secure your account</p>
            <h1>Choose a new password</h1>
            <p class="lede small" id="reset-intro">Open this page from a valid recovery link or verified phone recovery
                session.</p>
            <aside class="setup-notice" id="auth-setup-notice" role="alert" hidden>
                <strong>Sign-in setup needed</strong>
                <p id="auth-setup-detail"></p>
            </aside>
            <form id="reset-form" class="stack-form hidden"><label class="field"><span>New password</span><input
                        name="password" type="password" autocomplete="new-password" minlength="10" required><small>Use
                        at least 10 characters.</small></label><label class="field"><span>Confirm new
                        password</span><input name="confirm_password" type="password" autocomplete="new-password"
                        minlength="10" required></label><button class="button primary full" type="submit">Update
                    password <span aria-hidden="true">→</span></button>
                <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <footer id="site-footer"></footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>

</html>
